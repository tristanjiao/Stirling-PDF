<!DOCTYPE html>
<html th:lang="${#locale.language}" th:dir="#{language.direction}" th:data-language="${#locale.toString()}"
  xmlns:th="https://www.thymeleaf.org">

<head>
  <th:block th:insert="~{fragments/common :: head(title='')}"></th:block>
</head>

<body>
  <div class="page-container">
    <th:block th:insert="~{fragments/navbar.html :: navbar}"></th:block>
    <main class="home-wrapper">
      <section class="hero text-center">
        <h1 class="home-title">UtilitiesDock</h1>
        <p class="home-tagline"
          th:text="${@homeText != 'null' and @homeText != null and @homeText != ''} ? ${@homeText} : #{home.desc}">
        </p>
      </section>

      <section class="home-controls">
        <div class="search-row">
          <input type="text" id="searchBar" onkeyup="filterCards()" th:placeholder="#{home.searchBar}" autofocus>
        </div>
        <div class="options-row">
          <div class="sort-control">
            <label for="sort-options" th:text="#{home.sortBy}">Sort by:</label>
            <select id="sort-options">
              <option value="alphabetical" th:text="#{home.alphabetical}"></option>
              <option value="global" th:text="#{home.globalPopularity}"></option>
            </select>
          </div>
          <div class="favorites-row">
            <button type="button" class="icon-chip" th:title="#{home.setFavorites}" onclick="toggleFavoritesMode()">
              <span class="material-symbols-rounded toggle-favourites">star</span>
              <span class="chip-label" th:text="#{home.setFavorites}"></span>
            </button>
            <button type="button" class="icon-chip" id="favouritesVisibility" th:title="#{home.hideFavorites}"
              onclick="toggleFavoritesView()">
              <span id="toggle-favourites-icon" class="material-symbols-rounded toggle-favourites">visibility</span>
              <span class="chip-label" th:text="#{home.hideFavorites}"></span>
            </button>
            <a th:if="${@shouldShow}" th:href="@{'/releases'}"
              id="update-link" rel="noopener" th:title="#{settings.update}" class="icon-chip link-chip">
              <span class="material-symbols-rounded">update</span>
              <span class="chip-label" th:text="#{settings.update}"></span>
            </a>
          </div>
        </div>
      </section>

      <section class="feature-panel" id="groupRecent">
        <div class="feature-panel-header"
          th:replace="~{fragments/featureGroupHeader :: featureGroupHeader(groupTitle=#{navbar.recent})}"></div>
        <div class="recent-features">
          <div class="newfeature"
            th:insert="~{fragments/navbarEntry :: navbarEntry('add-attachments', 'attachment', 'home.attachments.title', 'home.attachments.desc', 'attachments.tags', 'other')}">
          </div>
          <div class="newfeature"
            th:insert="~{fragments/navbarEntry :: navbarEntry('scanner-effect', 'scanner', 'scannerEffect.title', 'scannerEffect.description', 'scannerEffect.tags', 'advance')}">
          </div>
          <div class="newfeature"
            th:insert="~{fragments/navbarEntry :: navbarEntry('compress-pdf', 'zoom_in_map', 'home.compressPdfs.title', 'home.compressPdfs.desc', 'compressPDFs.tags', 'advance')}">
          </div>
          <div class="newfeature"
            th:insert="~{fragments/navbarEntry :: navbarEntry('edit-table-of-contents', 'bookmark_add', 'home.editTableOfContents.title', 'home.editTableOfContents.desc', 'editTableOfContents.tags', 'advance')}">
          </div>
        </div>
      </section>

      <section class="features-section">
        <div class="features-container">
          <div class="feature-rows">
            <div id="groupFavorites" class="feature-group">
              <div th:replace="~{fragments/featureGroupHeader :: featureGroupHeader(groupTitle=#{navbar.favorite})}"></div>
              <div class="nav-group-container"></div>
            </div>
            <th:block th:insert="~{fragments/navElements.html :: navElements}"></th:block>
          </div>
        </div>
      </section>
    </main>
    <th:block th:insert="~{fragments/footer.html :: footer}"></th:block>
  </div>

  <script th:src="@{'/js/homecard.js'}"></script>
  <script th:inline="javascript">
    /*<![CDATA[*/
    window.analyticsPromptBoolean = false;
    window.showSurvey = false;
    /*]]>*/
  </script>
  <script th:src="@{'/js/pages/home.js'}" th:inline="javascript"></script>

  <style>
    .home-wrapper {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: clamp(1.5rem, 3vw, 3rem) clamp(1rem, 4vw, 3rem) 4rem;
      display: flex;
      flex-direction: column;
      gap: clamp(2rem, 4vw, 3.5rem);
    }

    .hero {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    .home-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
    }

    .home-tagline {
      max-width: 720px;
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--md-on-surface-variant);
      margin: 0 auto;
    }

    .home-controls {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
    }

    .search-row {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    #searchBar {
      width: min(520px, 100%);
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
      border: 1px solid var(--md-outlined-button-outline);
      background: var(--md-surface-container-highest);
      color: var(--md-on-surface);
    }

    #searchBar:focus {
      outline: none;
      border-color: var(--md-primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--md-primary) 15%, transparent);
    }

    .options-row {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      align-items: center;
    }

    .sort-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--md-surface-container);
      border-radius: 999px;
      padding: 0.4rem 1rem;
    }

    .sort-control select {
      border: none;
      background: transparent;
      color: inherit;
      font-weight: 600;
      padding-right: 0.5rem;
    }

    .sort-control select:focus {
      outline: none;
    }

    .favorites-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .icon-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: none;
      border-radius: 999px;
      padding: 0.45rem 1.1rem;
      background: var(--md-surface-container-low);
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .icon-chip:hover {
      background: var(--md-surface-container-high);
      transform: translateY(-1px);
    }

    .icon-chip:focus {
      outline: none;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--md-primary) 15%, transparent);
    }

    .chip-label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .favorites-row .material-symbols-rounded {
      font-size: 1.4rem;
    }

    .feature-panel {
      background: var(--md-surface-container-lowest);
      border-radius: 1.25rem;
      padding: clamp(1rem, 2vw, 1.5rem);
      box-shadow: 0 10px 30px -20px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .feature-panel-header {
      display: flex;
      justify-content: center;
    }

    .recent-features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }

    .features-section {
      display: flex;
      justify-content: center;
    }

    .features-container {
      width: 100%;
    }

    .feature-rows {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: clamp(1.5rem, 3vw, 2.5rem);
    }

    .feature-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-width: 0;
    }

    #groupFavorites {
      display: none;
    }

    @media (max-width: 768px) {
      .feature-rows {
        grid-template-columns: 1fr;
      }

      .home-wrapper {
        padding-bottom: 3rem;
      }

      .icon-chip {
        width: 100%;
        justify-content: center;
      }

      .sort-control {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</body>

</html>
