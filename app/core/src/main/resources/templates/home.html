<!DOCTYPE html>
<html th:lang="${#locale.language}" th:dir="#{language.direction}" th:data-language="${#locale.toString()}"
  xmlns:th="https://www.thymeleaf.org">

<head>
  <th:block th:insert="~{fragments/common :: head(title='')}"></th:block>
</head>

<body>
  <div class="page-container">
    <th:block th:insert="~{fragments/navbar.html :: navbar}"></th:block>
    <main class="home-wrapper">
      <section class="hero text-center">
        <h1 class="home-title">UtilitiesDock</h1>
        <p class="home-tagline"
          th:text="${@homeText != 'null' and @homeText != null and @homeText != ''} ? ${@homeText} : #{home.desc}">
        </p>
      </section>

      <section class="home-controls">
        <div class="options-row">
          <div class="sort-control">
            <label for="sort-options" th:text="#{home.sortBy}">Sort by:</label>
            <select id="sort-options">
              <option value="alphabetical" th:text="#{home.alphabetical}"></option>
              <option value="global" th:text="#{home.globalPopularity}"></option>
            </select>
          </div>
          <div class="favorites-row">
            <button type="button" class="icon-chip" id="favouritesVisibility" th:title="#{home.hideFavorites}"
              onclick="toggleFavoritesView()">
              <span id="toggle-favourites-icon" class="material-symbols-rounded toggle-favourites">visibility</span>
              <span class="chip-label" th:text="#{home.hideFavorites}"></span>
            </button>
            <a th:if="${@shouldShow}" th:href="@{'/releases'}"
              id="update-link" rel="noopener" th:title="#{settings.update}" class="icon-chip link-chip">
              <span class="material-symbols-rounded">update</span>
              <span class="chip-label" th:text="#{settings.update}"></span>
            </a>
          </div>
        </div>
      </section>

      <section class="features-section">
        <div class="features-container">
          <div class="feature-rows">
            <div id="groupFavorites" class="feature-group">
              <div th:replace="~{fragments/featureGroupHeader :: featureGroupHeader(groupTitle=#{navbar.favorite})}"></div>
              <div class="nav-group-container"></div>
            </div>
            <th:block th:insert="~{fragments/navElements.html :: navElements}"></th:block>
          </div>
        </div>
      </section>
    </main>
    <th:block th:insert="~{fragments/footer.html :: footer}"></th:block>
  </div>

  <script th:src="@{'/js/homecard.js'}"></script>
  <script th:inline="javascript">
    /*<![CDATA[*/
    window.analyticsPromptBoolean = false;
    window.showSurvey = false;
    /*]]>*/
  </script>
  <script th:src="@{'/js/pages/home.js'}" th:inline="javascript"></script>

  <style>
    .home-wrapper {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: clamp(1.5rem, 3vw, 3rem) clamp(1rem, 4vw, 3rem) 4rem;
      display: flex;
      flex-direction: column;
      gap: clamp(2rem, 4vw, 3.5rem);
    }

    .hero {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    .home-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
    }

    .home-tagline {
      max-width: 720px;
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--md-on-surface-variant);
      margin: 0 auto;
    }

    .home-controls {
      display: flex;
      justify-content: center;
    }

    .options-row {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      align-items: center;
    }

    .sort-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--md-surface-container);
      border-radius: 999px;
      padding: 0.4rem 1rem;
    }

    .sort-control select {
      border: none;
      background: transparent;
      color: inherit;
      font-weight: 600;
      padding-right: 0.5rem;
    }

    .sort-control select:focus {
      outline: none;
    }

    .favorites-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .icon-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: none;
      border-radius: 999px;
      padding: 0.45rem 1.1rem;
      background: var(--md-surface-container-low);
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .icon-chip:hover {
      background: var(--md-surface-container-high);
      transform: translateY(-1px);
    }

    .icon-chip:focus {
      outline: none;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--md-primary) 15%, transparent);
    }

    .chip-label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .favorites-row .material-symbols-rounded {
      font-size: 1.4rem;
    }

    .features-section {
      display: flex;
      justify-content: center;
    }

    .features-container {
      width: 100%;
    }

    .feature-rows {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: clamp(0.75rem, 1.5vw, 1.25rem);
      padding: 0 clamp(0.25rem, 1.5vw, 1rem);
      box-sizing: border-box;
      align-items: start;
    }

    .feature-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-width: 0;
    }

    #groupFavorites {
      display: none;
    }

    .feature-group-header .menu-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .feature-group .nav-group-container {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .feature-group .dropdown-item {
      padding: 0.3rem 0.4rem;
      border-radius: 0.65rem;
    }

    .feature-group .dropdown-item .icon {
      gap: 0.25rem;
      min-height: 2rem !important;
    }

    .feature-group .dropdown-item .nav-icon {
      width: 1.9rem !important;
      height: 1.9rem !important;
      font-size: 1.2rem !important;
    }

    .feature-group .dropdown-item svg.nav-icon {
      width: 1.9rem !important;
      height: 1.9rem !important;
    }

    .feature-group .dropdown-item .icon-text {
      font-size: 0.85rem;
      line-height: 1.25;
    }

    .feature-group .dropdown-item .icon-text .title {
      font-size: inherit;
    }

    @media (max-width: 1200px) {
      .feature-rows {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 1080px) {
      .feature-rows {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .feature-rows {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      .home-controls {
        flex-direction: column;
        gap: 1rem;
      }

      .home-wrapper {
        padding-bottom: 3rem;
      }

      .icon-chip {
        width: 100%;
        justify-content: center;
      }

      .sort-control {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 540px) {
      .feature-rows {
        grid-template-columns: 1fr;
      }

      .feature-group .dropdown-item {
        padding: 0.4rem 0.5rem;
      }
    }
  </style>
</body>

</html>
